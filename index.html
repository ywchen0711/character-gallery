<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14201a">
<meta name="description" content="人物像素圖庫：旅人一家、龍門武林、怪物與野獸與三國人物，主畫風為 8-bit 紅白機（霸王の大陸風），也保留多種像素畫風的頭像與全身動畫。">
<title>人物圖庫 Character Gallery</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 data-zh="人物圖庫" data-en="Character Gallery">人物圖庫</h1>
    <p class="sub" data-zh="旅人一家、龍門武林、怪物與野獸與三國人物 · 像素畫風的頭像與全身動畫" data-en="The travelling family, the Longmen Wulin cast, monsters &amp; beasts and the Three Kingdoms · pixel portraits and animated sprites">旅人一家、龍門武林、怪物與野獸與三國人物 · 像素畫風的頭像與全身動畫</p>
  </div>
  <div class="tools">
    <a class="chip strong" href="compare.html" data-zh="畫風比較 →" data-en="Compare styles →">畫風比較 →</a>
    <button id="lang" class="chip" type="button" aria-label="Language">EN</button>
  </div>
</header>

<section class="hero" id="heroes" aria-label="group rosters"></section>

<nav class="filters" id="filters" aria-label="faction filter">
  <button class="chip on" data-f="all" data-zh="全部" data-en="All">全部</button>
  <button class="chip" data-f="wu" data-zh="吳" data-en="Wu">吳</button>
  <button class="chip" data-f="shu" data-zh="蜀" data-en="Shu">蜀</button>
  <button class="chip" data-f="wei" data-zh="魏" data-en="Wei">魏</button>
  <button class="chip" data-f="qun" data-zh="群" data-en="Other">群</button>
  <button class="chip" data-f="west" data-zh="旅人一家" data-en="The family">旅人一家</button>
  <button class="chip" data-f="sango" data-zh="霸王之路" data-en="Path of the Hegemon">霸王之路</button>
  <button class="chip" data-f="longmen" data-zh="龍門武林" data-en="Longmen Wulin">龍門武林</button>
  <button class="chip" data-f="beast" data-zh="怪物與野獸" data-en="Monsters &amp; Beasts">怪物與野獸</button>
  <button class="chip" data-f="foe" data-zh="小怪" data-en="Common Foes">小怪</button>
</nav>
<nav class="filters styles" id="stylef" aria-label="style filter"></nav>

<main>
  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" hidden data-zh="這裡還沒有人物，敬請期待。" data-en="Nothing here yet.">這裡還沒有人物，敬請期待。</p>
</main>

<div id="detail" class="detail" hidden role="dialog" aria-modal="true" aria-labelledby="d-name">
  <div class="sheet">
    <button id="close" class="close" type="button" aria-label="close">×</button>
    <div class="d-head">
      <span class="badge" id="d-faction"></span>
      <h2 id="d-name"></h2>
      <p class="d-title" id="d-title"></p>
    </div>
    <div class="anims" id="d-styles"></div>
    <p class="blurb" id="d-blurb"></p>
    <div class="d-art">
      <figure class="frame por"><canvas id="d-por" width="56" height="64"></canvas>
        <figcaption data-zh="頭像" data-en="Portrait">頭像</figcaption></figure>
      <figure class="frame chi"><canvas id="d-chi" width="56" height="64"></canvas>
        <figcaption data-zh="全身" data-en="Full body">全身</figcaption></figure>
    </div>
    <div class="anims" id="d-anims"></div>
    <p class="bio" id="d-bio"></p>
    <p class="meta" id="d-meta"></p>
    <h3 data-zh="下載" data-en="Downloads">下載</h3>
    <div class="dl" id="d-dl"></div>
  </div>
</div>

<footer class="foot">
  <p data-zh="全部為原創像素畫，只模仿各遊戲的畫風，沒有描摹或複製。CC BY 4.0。" data-en="All original pixel art that imitates each game's look only; nothing traced or copied. CC BY 4.0.">全部為原創像素畫，只模仿各遊戲的畫風，沒有描摹或複製。CC BY 4.0。</p>
</footer>
<script src="app.js?v=11"></script>
</body>
</html>
