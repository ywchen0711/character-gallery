<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14201a">
<meta name="description" content="像素畫風並排比較：主畫風 8-bit 紅白機（霸王の大陸風），以及先前的 HD-2D、SNES、GBA、勇者鬥惡龍風與 16-bit 三國畫風。">
<title>畫風比較 Style Comparison</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 data-zh="畫風比較" data-en="Style comparison">畫風比較</h1>
    <p class="sub" data-zh="最上面是新的主畫風：8-bit 紅白機（霸王の大陸風）；下面保留先前的畫風，方便比較。" data-en="On top, the new main style: 8-bit Famicom (霸王の大陸-like); below, the earlier styles for comparison.">最上面是新的主畫風：8-bit 紅白機（霸王の大陸風）；下面保留先前的畫風，方便比較。</p>
  </div>
  <div class="tools">
    <a class="chip" href="index.html" data-zh="← 圖庫" data-en="← Gallery">← 圖庫</a>
    <button id="lang" class="chip" type="button" aria-label="Language">EN</button>
  </div>
</header>

<main>
  <section class="hero" aria-label="family"><canvas id="hero-canvas" width="128" height="72"></canvas><p id="hero-cap" class="hero-cap"></p></section>
  <div class="sec-row">
    <h2 class="sec" data-zh="主畫風：8-bit 紅白機（三國志 霸王の大陸風）" data-en="Main style: 8-bit Famicom (三國志 霸王の大陸-like)">主畫風：8-bit 紅白機（三國志 霸王の大陸風）</h2>
    <button id="nes-pick" class="chip pick" type="button">選這個畫風</button>
  </div>
  <p class="cmp-blurb" data-zh="48×56 頭像只用紅白機色盤，每 16×16 格一組三色；小人 16×24，正面與側面兩格步行。" data-en="48×56 portraits in NES palette colours, one 3-colour set per 16×16 area; 16×24 sprites with a two-frame front and side walk.">48×56 頭像只用紅白機色盤，每 16×16 格一組三色；小人 16×24，正面與側面兩格步行。</p>
  <div id="cmp-nes" class="cmp-grid"></div>

  <div class="sec-row">
    <h2 class="sec" data-zh="前一版主畫風：HD-2D 可愛版（一家四口）" data-en="Previous main style: HD-2D, cuter (the family)">前一版主畫風：HD-2D 可愛版（一家四口）</h2>
    <button id="family-pick" class="chip pick" type="button">選這個畫風</button>
  </div>
  <p class="cmp-blurb" data-zh="待機、正面行走、招式；同一畫布與地平線，大人與孩子的身高差一目了然。" data-en="Idle, front walk and signature move; one canvas and baseline, so the adults' and children's heights compare directly.">待機、正面行走、招式；同一畫布與地平線，大人與孩子的身高差一目了然。</p>
  <div id="cmp-family" class="cmp-grid"></div>

  <h2 class="sec" data-zh="更早的四種畫風" data-en="The earlier four styles">更早的四種畫風</h2>
  <div id="cmp-own" class="cmp-grid"></div>

  <div class="sec-row">
    <h2 class="sec" data-zh="同樣四人，關羽的畫風（霸王の大陸 × 像素棒球）" data-en="The same four in Guan Yu's style (16-bit Three Kingdoms × pixel baseball)">同樣四人，關羽的畫風（霸王の大陸 × 像素棒球）</h2>
    <button id="koei-pick" class="chip pick" type="button">選這個畫風</button>
  </div>
  <div id="cmp-koei" class="cmp-grid koei"></div>
  <p id="pick-note" class="pick-note"></p>
</main>

<footer class="foot">
  <p data-zh="全部為原創像素畫，只模仿各遊戲的畫風，沒有描摹或複製。CC BY 4.0。" data-en="All original pixel art that imitates each game's look only; nothing traced or copied. CC BY 4.0.">全部為原創像素畫，只模仿各遊戲的畫風，沒有描摹或複製。CC BY 4.0。</p>
</footer>
<script src="app.js?v=5"></script>
</body>
</html>
